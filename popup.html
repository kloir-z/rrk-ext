<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽楽勤怠カスタマイザー 設定</title>
  <style>
    body {
      width: 400px;
      max-height: 800px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 10px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #0078d4;
      color: #333;
      flex-shrink: 0;
    }

    .unsaved-indicator {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 15px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      flex-shrink: 0;
    }

    .section {
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    .section.column-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      flex-shrink: 1;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #555;
      font-size: 13px;
      flex-shrink: 0;
    }

    .column-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      min-height: 200px;
      max-height: 350px;
    }

    .column-item {
      display: flex;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .column-item:last-child {
      border-bottom: none;
    }

    .column-item label {
      display: flex;
      align-items: center;
      cursor: pointer;
      flex: 1;
    }

    .column-item input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-shrink: 0;
    }

    button {
      flex: 1;
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .btn-save {
      background-color: #0078d4;
      color: white;
    }

    .btn-save:hover {
      background-color: #005a9e;
    }

    .btn-cancel {
      background-color: #6c757d;
      color: white;
    }

    .btn-cancel:hover {
      background-color: #5a6268;
    }

    .btn-reset {
      background-color: #f0f0f0;
      color: #333;
    }

    .btn-reset:hover {
      background-color: #e0e0e0;
    }

    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
      flex-shrink: 0;
      min-height: 16px;
      visibility: hidden;
    }

    .status.success {
      background-color: #dff0d8;
      color: #3c763d;
      visibility: visible;
    }

    .quick-presets {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .quick-presets button {
      padding: 5px 10px;
      font-size: 11px;
      background-color: #f8f8f8;
      color: #666;
      border: 1px solid #ddd;
    }

    .quick-presets button:hover {
      background-color: #e8e8e8;
    }

    .remarks-width-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .remarks-width-control input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    .remarks-width-control span {
      min-width: 60px;
      text-align: right;
      font-weight: bold;
      color: #0078d4;
      font-size: 13px;
    }

    .color-enable {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .color-enable input[type="checkbox"] {
      cursor: pointer;
    }

    .color-enable label {
      cursor: pointer;
      font-weight: 500;
    }

    .color-settings {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      background-color: #f9f9f9;
    }

    .color-settings.enabled {
      display: block;
    }

    .color-item {
      margin-bottom: 12px;
    }

    .color-item:last-child {
      margin-bottom: 0;
    }

    .color-item-title {
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }

    .color-inputs {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .color-input-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .color-input-group label {
      font-size: 10px;
      color: #888;
      text-align: center;
    }

    .color-input-group input {
      width: 50px;
      padding: 4px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 12px;
      text-align: center;
    }

    .color-preview {
      width: 60px;
      height: 30px;
      border: 1px solid #ccc;
      border-radius: 3px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <h1>表示列の設定</h1>

  <!-- 未保存の変更インジケーター -->
  <div class="unsaved-indicator" id="unsavedIndicator" style="display: none;">
    未保存の変更があります
  </div>

  <div class="section">
    <div class="section-title">クイック設定</div>
    <div class="quick-presets">
      <button id="presetMinimal">最小限</button>
      <button id="presetBasic">基本</button>
      <button id="presetAll">すべて表示</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">備考列の幅</div>
    <div class="remarks-width-control">
      <input type="range" id="remarksWidth" min="200" max="800" value="400" step="50">
      <span id="remarksWidthValue">400px</span>
    </div>
  </div>

  <div class="section">
    <div class="color-enable">
      <input type="checkbox" id="enableRowColors">
      <label for="enableRowColors">土日祝の色付けを有効にする</label>
    </div>
    <div class="color-settings" id="colorSettings">
      <div class="color-item">
        <div class="color-item-title">土曜日色</div>
        <div class="color-inputs">
          <div class="color-input-group">
            <label>R</label>
            <input type="number" id="saturdayR" min="0" max="255" value="224">
          </div>
          <div class="color-input-group">
            <label>G</label>
            <input type="number" id="saturdayG" min="0" max="255" value="240">
          </div>
          <div class="color-input-group">
            <label>B</label>
            <input type="number" id="saturdayB" min="0" max="255" value="255">
          </div>
          <div class="color-input-group">
            <label>A</label>
            <input type="number" id="saturdayA" min="0" max="1" step="0.1" value="1">
          </div>
          <div class="color-preview" id="saturdayPreview"></div>
        </div>
      </div>
      <div class="color-item">
        <div class="color-item-title">日曜祝日色</div>
        <div class="color-inputs">
          <div class="color-input-group">
            <label>R</label>
            <input type="number" id="sundayHolidayR" min="0" max="255" value="255">
          </div>
          <div class="color-input-group">
            <label>G</label>
            <input type="number" id="sundayHolidayG" min="0" max="255" value="237">
          </div>
          <div class="color-input-group">
            <label>B</label>
            <input type="number" id="sundayHolidayB" min="0" max="255" value="237">
          </div>
          <div class="color-input-group">
            <label>A</label>
            <input type="number" id="sundayHolidayA" min="0" max="1" step="0.1" value="1">
          </div>
          <div class="color-preview" id="sundayHolidayPreview"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section column-section">
    <div class="section-title">表示する列を選択</div>
    <div class="column-list" id="columnList">
      <!-- JavaScriptで動的に生成 -->
    </div>
  </div>

  <div class="buttons">
    <button class="btn-save" id="saveBtn">保存</button>
    <button class="btn-cancel" id="cancelBtn">キャンセル</button>
    <button class="btn-reset" id="resetBtn">リセット</button>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
